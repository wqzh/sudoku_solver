<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>ORT probe</title></head>
<body>
<pre id="out">loading…</pre>
<script src="/vendor/ort/ort.wasm.min.js"></script>
<script>
const out = document.getElementById("out");
const log = (m) => { out.textContent += "\n" + m; };
(async () => {
  try {
    ort.env.wasm.wasmPaths = "/vendor/ort/";
    ort.env.wasm.numThreads = 1;
    log("ort " + (ort.env.versions ? JSON.stringify(ort.env.versions) : "loaded"));
    const t0 = performance.now();
    const det = await ort.InferenceSession.create("/models/grid_detector_yolov8n_640_int8.onnx", {
      executionProviders: ["wasm"], graphOptimizationLevel: "all",
    });
    log("det loaded in " + Math.round(performance.now() - t0) + "ms; inputs=" +
        JSON.stringify(det.inputNames) + " outputs=" + JSON.stringify(det.outputNames));
    const x = new ort.Tensor("float32", new Float32Array(3 * 640 * 640), [1, 3, 640, 640]);
    const t1 = performance.now();
    const y = await det.run({ images: x });
    const o = y[det.outputNames[0]];
    log("det ran in " + Math.round(performance.now() - t1) + "ms; out dims=" + JSON.stringify(o.dims));
    const d = await ort.InferenceSession.create("/models/digit_classifier_28x28.onnx", {
      executionProviders: ["wasm"], graphOptimizationLevel: "all",
    });
    const z = new ort.Tensor("float32", new Float32Array(2 * 28 * 28), [2, 28, 28, 1]);
    const dz = await d.run({ [d.inputNames[0]]: z });
    log("digit out dims=" + JSON.stringify(dz[d.outputNames[0]].dims));
    document.title = "PROBE_OK";
    log("PROBE_OK");
  } catch (e) {
    document.title = "PROBE_FAIL";
    log("PROBE_FAIL: " + (e && (e.stack || e.message || e)));
  }
})();
</script>
</body>
</html>
